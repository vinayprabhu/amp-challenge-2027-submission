[project]
name = "amp-challenge-2027"
version = "1.0.0"
description = "Generative antimicrobial peptide library for the NeurIPS AMP Challenge 2027"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.26"]

[project.scripts]
generate = "amp_challenge_2027.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amp_challenge_2027"]
